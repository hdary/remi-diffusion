site_name: IRM de diffusion
site_description: Synthèse opérationnelle des bonnes pratiques en IRM de diffusion.
theme:
  name: material
  logo: assets/images/site/logo_remi.png
  favicon: assets/images/site/logo_remi.png
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
  language: fr
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Passer au mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Passer au mode clair
nav:
  - Accueil: index.md
  - Acquisition:
    - Introduction: acquisition/index.md
    - L'IRM de Diffusion: acquisition/01-diffusion
    - Contraintes liées à l'organe: acquisition/02-organes.md
    - Contraintes liées à la population: acquisition/03-population.md
    - Paramètres généraux: acquisition/04-parametre-generaux.md
    - Paramètres spécifiques: acquisition/05-parametre-spécifiques.md
    - Conseils par type d'analyses: acquisition/06-conseils-par-analyses.md
    - Multicentrique: acquisition/07-multicentrique.md
    - À la console: acquisition/08-console.md
    - Export des données: acquisition/09-export.md
  - Traitement:
    - Introduction: analyses/index.md
    - Préparation BIDS: analyses/01-preparation-bids.md
    - Contrôle qualité: analyses/02-controle-qualite.md
    - Prétraitements: analyses/03-pretraitements.md
    - Modélisations: analyses/04-modelisations.md
    - Tractographie: analyses/05-tractographie.md
    - Analyses voxel-wise: analyses/06-analyses-voxel-wise.md
  - Tutoriel:
    - Introduction: tutorial/index.md
    - Notebooks: tutorial/notebooks/README.md
  - Contributeur: contributeur.md
